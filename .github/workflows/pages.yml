name: Deploy GitHub Pages report

on:
  push:
    branches: [main]
    paths:
      - websites.yaml
      - scripts/**
      - history/**
      - requirements-docs/**
      - requirements-docs.txt
      - .github/workflows/pages.yml
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-docs.txt

      - name: Check domains (DNS, HTTP, SSL)
        run: python3 scripts/check_domains.py

      - name: Process alerts (compare with previous snapshot)
        run: python3 scripts/alerts.py --summary

      - name: Append history snapshot and compute trends
        run: python3 scripts/history.py --append

      - name: Generate health report
        run: python3 scripts/generate_report.py

      - name: Build requirements docs (Sphinx + Mermaid)
        run: python3 -m sphinx -b html requirements-docs docs/docs

      - name: Commit history updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          git diff --staged --quiet || git commit -m "Update check history [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
